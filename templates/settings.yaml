# Resilio Configuration
# Non-secret settings for the application

# File paths (relative to repository root)
paths:
  athlete_dir: "data/athlete"
  activities_dir: "data/activities"
  plans_dir: "data/plans"
  state_dir: "data/state"

# External activity/calendar integration
intervals_icu:
  api_base_url: "https://intervals.icu/api/v1"
  athlete_alias: "0"
  history_start_date: "2022-01-20"
  initial_window_days: 90
  incremental_overlap_days: 30
  full_reconciliation_days: 30
  list_limit: 1000
  detail_batch_size: 100
  max_read_attempts: 4
  request_timeout_seconds: 30
